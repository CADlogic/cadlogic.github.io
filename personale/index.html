<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Angelo Speciale</title>
  <style>
    :root {
      --bg-color: #0f172a;      /* Sfondo scuro moderno */
      --card-bg: #1e293b;       /* Sfondo scheda */
      --primary-color: #10b981;  /* Verde smeraldo per il tasto principale */
      --primary-hover: #059669;  /* Verde scuro hover */
      --btn-alt-bg: #334155;    /* Sfondo tasti secondari */
      --btn-alt-hover: #475569; /* Hover tasti secondari */
      --text-main: #f8fafc;     /* Testo principale */
      --text-sub: #94a3b8;      /* Testo secondario */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 380px;
      padding: 32px 24px;
      border-radius: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .avatar {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: #ffffff;
      font-size: 28px;
      font-weight: 700;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 24px;
    }

    .buttons-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    a.btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border-radius: 14px;
      background-color: var(--primary-color);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.2s ease;
    }

    a.btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
    }

    a.btn.alt {
      background-color: var(--btn-alt-bg);
      color: var(--text-main);
    }

    a.btn.alt:hover {
      background-color: var(--btn-alt-hover);
    }

    /* Piccola icona SVG nei pulsanti */
    .icon {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar">AS</div>
    <h1>Angelo Speciale</h1>
    <p class="subtitle">Contatto Personale</p>

    <div class="buttons-container">
      <a class="btn" href="contatto.vcf">
        <svg class="icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.78c0-2.33 4.67-3.5 7-3.5s7 1.17 7 3.5v.78z"/></svg>
        Salva contatto
      </a>

      <a class="btn alt" href="mailto:angelo.spe@icloud.com">
        <svg class="icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        Scrivi una email
      </a>

      <a class="btn alt" href="mailto:angelo.spe@icloud.com?subject=Richiesta%20numero%20di%20telefono">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8s0 0 0 0z"/></svg>
        Chiedimi il numero
      </a>
    </div>
  </div>

</body>
</html>
